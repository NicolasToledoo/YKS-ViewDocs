<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YKS-ViewDocs — Visualizador</title>
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div id="app">
    <header class="viewer-header">
      <div class="header-left">
        <h1 class="app-title">YKS-ViewDocs</h1>
        <span class="file-name" id="fileName"></span>
      </div>
      <div class="header-right">
        <span class="file-badge" id="fileBadge"></span>
        <button id="downloadBtn" class="btn btn-secondary" title="Download">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <circle cx="12" cy="12" r="10" opacity="0.2"/>
            <path d="M12 5v12"/>
            <polyline points="17 10 12 15 7 10"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="viewer-content" id="viewerContent">
      <div class="loading" id="loadingIndicator">
        <div class="spinner"></div>
        <p>Carregando documento...</p>
      </div>
      <div class="error hidden" id="errorIndicator">
        <p id="errorMessage"></p>
      </div>
      <div class="picker-view hidden" id="pickerView">
        <div class="picker-zone" id="pickerZone">
          <svg class="picker-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" opacity="0.2"/>
            <path d="M12 19V7"/>
            <polyline points="7 12 12 7 17 12"/>
          </svg>
          <p class="picker-text">Arraste um documento aqui</p>
          <p class="picker-hint">ou clique para selecionar</p>
          <input type="file" id="pickerInput" class="file-input" accept=".pdf,.doc,.docx,.rtf,.txt,.md,.markdown,.epub,.mobi,.azw,.azw3,.fb2,.cbz" />
        </div>
        <div class="picker-formats">
          <span class="format-badge">PDF</span>
          <span class="format-badge">DOCX</span>
          <span class="format-badge">DOC</span>
          <span class="format-badge">RTF</span>
          <span class="format-badge">TXT</span>
          <span class="format-badge">MD</span>
          <span class="format-badge">EPUB</span>
          <span class="format-badge">MOBI</span>
          <span class="format-badge">FB2</span>
          <span class="format-badge">CBZ</span>
        </div>
      </div>
    </main>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
